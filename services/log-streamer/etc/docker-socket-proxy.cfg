# Custom HAProxy configuration for docker-socket-proxy (FDY-0558).
#
# The tecnativa/docker-socket-proxy v0.4.2 does NOT recognise ARCHIVE, ENV,
# TOP, or CREATES as environment variables; when CONTAINERS=1 it allows the
# *entire* /containers prefix (including /archive, /export, /top, /logs, and
# /json which leaks environment variables).
#
# This file overrides the auto-generated configuration to keep only:
#   GET  /containers/json              - list containers
#   GET  /containers/{id}/json        - inspect a single container (state only)
#   GET  /events                       - container lifecycle events
#   GET  /version                      - version check
#
# Every other route under /containers/ (archive, export, top, exec, etc.)
# is explicitly denied with 403.
#
# Note: path_beg /containers/ would match /containers/json too, so we use
# path_reg with hex-ID patterns to target specific container actions.

global
    log stdout format raw local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend docker
    bind *:2375

    # ----------------------------------------------------------------
    # Explicit deny rules - placed BEFORE any allow so they take precedence
    # ----------------------------------------------------------------

    # /containers/{id}/archive - file extraction from containers
    acl deny_archive path_reg /containers/[a-f0-9]+/archive
    http-request deny deny_status 403 if deny_archive

    # /containers/{id}/export - full container export
    acl deny_export path_reg /containers/[a-f0-9]+/export
    http-request deny deny_status 403 if deny_export

    # /containers/{id}/top - process listing
    acl deny_top path_reg /containers/[a-f0-9]+/top
    http-request deny deny_status 403 if deny_top

    # /containers/{id}/exec/* - arbitrary command execution
    acl deny_exec path_reg /containers/[a-f0-9]+/exec
    http-request deny deny_status 403 if deny_exec

    # /containers/{id}/attach - interactive attach
    acl deny_attach path_reg /containers/[a-f0-9]+/attach
    http-request deny deny_status 403 if deny_attach

    # /containers/{id}/wait - blocking wait
    acl deny_wait path_reg /containers/[a-f0-9]+/wait
    http-request deny deny_status 403 if deny_wait

    # /containers/create - container creation
    acl deny_create path /containers/create
    http-request deny deny_status 403 if deny_create

    # /containers/{id}/resize - pseudo-tty resize
    acl deny_resize path_reg /containers/[a-f0-9]+/resize
    http-request deny deny_status 403 if deny_resize

    # /containers/{id}/start - container start
    acl deny_start path_reg /containers/[a-f0-9]+/start
    http-request deny deny_status 403 if deny_start

    # /containers/{id}/stop - container stop
    acl deny_stop path_reg /containers/[a-f0-9]+/stop
    http-request deny deny_status 403 if deny_stop

    # /containers/{id}/kill - container kill
    acl deny_kill path_reg /containers/[a-f0-9]+/kill
    http-request deny deny_status 403 if deny_kill

    # /containers/{id}/pause / unpause
    acl deny_pause path_reg /containers/[a-f0-9]+/pause
    http-request deny deny_status 403 if deny_pause
    acl deny_unpause path_reg /containers/[a-f0-9]+/unpause
    http-request deny deny_status 403 if deny_unpause

    # /containers/{id}/rename - rename container
    acl deny_rename path_reg /containers/[a-f0-9]+/rename
    http-request deny deny_status 403 if deny_rename

    # /containers/{id}/commit - create image from container
    acl deny_commit path_reg /containers/[a-f0-9]+/commit
    http-request deny deny_status 403 if deny_commit

    # /containers/{id}/copy - copy files to/from container
    acl deny_copy path_reg /containers/[a-f0-9]+/copy
    http-request deny deny_status 403 if deny_copy

    # /containers/prune - bulk removal
    acl deny_prune path /containers/prune
    http-request deny deny_status 403 if deny_prune

    # /containers/{id}/logs - container logs (may leak env vars)
    acl deny_logs path_reg /containers/[a-f0-9]+/logs
    http-request deny deny_status 403 if deny_logs

    # /images/prune - image prune
    acl deny_images_prune path /images/prune
    http-request deny deny_status 403 if deny_images_prune

    # /volumes/prune - volume prune
    acl deny_volumes_prune path /volumes/prune
    http-request deny deny_status 403 if deny_volumes_prune

    # /volumes/{id} - volume operations
    acl deny_volumes path_beg /volumes
    http-request deny deny_status 403 if deny_volumes

    # /images - image operations
    acl deny_images path_beg /images
    http-request deny deny_status 403 if deny_images

    # /secrets - secret operations
    acl deny_secrets path_beg /secrets
    http-request deny deny_status 403 if deny_secrets

    # /configs - config operations
    acl deny_configs path_beg /configs
    http-request deny deny_status 403 if deny_configs

    # /tasks - task operations
    acl deny_tasks path_beg /tasks
    http-request deny deny_status 403 if deny_tasks

    # /swarm - swarm operations
    acl deny_swarm path_beg /swarm
    http-request deny deny_status 403 if deny_swarm

    # /nodes - node operations
    acl deny_nodes path_beg /nodes
    http-request deny deny_status 403 if deny_nodes

    # /plugins - plugin operations
    acl deny_plugins path_beg /plugins
    http-request deny deny_status 403 if deny_plugins

    # /auth - registry auth
    acl deny_auth path_beg /auth
    http-request deny deny_status 403 if deny_auth

    # /trust - trust operations
    acl deny_trust path_beg /trust
    http-request deny deny_status 403 if deny_trust

    # /session - session operations
    acl deny_session path_beg /session
    http-request deny deny_status 403 if deny_session

    # /info - daemon info (leaks env vars)
    acl deny_info path /info
    http-request deny deny_status 403 if deny_info

    # ----------------------------------------------------------------
    # Allowed routes
    # ----------------------------------------------------------------

    # GET /events - container lifecycle events (needed by log-streamer)
    acl allow_events path /events
    use_backend docker_engine if allow_events

    # GET /containers/json - list containers (needed by log-streamer)
    acl allow_list path /containers/json
    use_backend docker_engine if allow_list

    # GET /containers/{id}/json - inspect a single container (state only)
    acl allow_inspect path_beg /containers/
    acl allow_inspect path_end /json
    use_backend docker_engine if allow_inspect

    # GET /version - version check
    acl allow_version path /version
    use_backend docker_engine if allow_version

    # ----------------------------------------------------------------
    # Default: deny everything else
    # ----------------------------------------------------------------
    default_backend deny_all

backend docker_engine
    server docker_engine /var/run/docker.sock:0 check

backend deny_all
    http-request deny deny_status 403
