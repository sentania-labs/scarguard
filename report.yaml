task_external_id: "FDY-0562"
summary: |
  Implemented channel-bound HMAC-SHA256 signed envelopes with timestamps,
  unique nonces, and a bounded replay cache across all privileged Redis
  channels in ScarGuard. Detection events from the detector, admin commands
  (test-fire, test-fire-group), pause/resume from the trainer, evaluation
  requests from the web UI, and backup triggers from the web UI are now
  all signed and verified on the consumer side. Emergency force-off
  remains unsigned for operational resilience. A new regression test
  (20 tests) exercises real handlers against forged, replayed, cross-channel,
  and stale inputs.

