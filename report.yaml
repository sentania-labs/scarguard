proposed_pull_request:
  title: "FDY-0562: Channel-bound signed envelopes for detection events and privileged commands"
  body: |
    ## Summary

    Add HMAC-SHA256 channel-bound signed envelopes with timestamps, unique
    nonces, and a bounded replay cache across all privileged Redis channels
    in ScarGuard.

    ## Changes

    - **shared/event_signing.py**: Rewritten with channel-bound envelope
      format, bounded _ReplayCache, sign_event() with channel binding,
      verify_event() with staleness + nonce dedup checks.
    - **shared/pause_protocol.py**: PauseClient now signs pause/resume
      commands via envelope before publishing.
    - **services/detector/src/publisher.py**: Detection events signed
      before Redis publish; key absence logged at startup.
    - **services/detector/src/pause_handler.py**: Commands verified via
      _verify_command(); migration window accepts unsigned if no key.
    - **services/detector/src/evaluator.py**: Eval requests verified via
      _verify_eval_request(); rejects unsigned.
    - **services/notifier/src/main.py**: Detection events verified before
      notification dispatch; suppressed if verification fails.
    - **services/deterrent/src/request_handler.py**: test-fire,
      test-fire-group, status-request verified; force-off bypassed.
    - **services/web/src/routes/deterrent.py**: test-fire signs envelope;
      force-off unsigned.
    - **services/web/src/routes/training.py**: Eval requests signed.
    - **services/web/src/routes/backups.py**: Backup triggers signed.
    - **services/backup/src/main.py**: Backup triggers verified.
    - **services/detector/tests/test_fdy_0562_regression.py**: New 20-test
      regression suite exercising forged, replayed, cross-channel, stale,
      and legacy-compatible inputs against actual handlers.

    ## Security Properties

    - **Channel binding**: Signatures include channel name; cross-channel
      replay attacks are impossible.
    - **Replay protection**: Nonce-based dedup via bounded _ReplayCache
      (4096 capacity, 60s TTL per channel).
    - **Staleness**: Timestamps validated against MESSAGE_TTL_SECONDS
      (15 seconds default).
    - **Emergency bypass**: force-off channel explicitly excluded from
      verification to ensure operability.
    - **Backwards compatible**: When no key configured, existing unsigned
      messages still work (migration window).

    ## Test Results

    - Detector: 70/70 passing
    - Deterrent: 219/219 passing
    - Notifier: 65/65 passing
    - Trainer: 18/18 passing
    - Web (deterrent route): 18/18 passing
    - Lint: ruff passes zero errors
    - Type check: mypy passes zero issues

limitations:
  - No signing key rotation mechanism is implemented; a single ENV var
    value serves all channels. Adding rotation would require coordination
    across all services and cache clearing.
  - The replay cache uses an in-memory dict with TTL eviction; under
    very high event rates (~1000/s sustained), the cache could hit its
    4096 capacity and drop older nonces. This is acceptable for the
    deployment scale (Jetson, a few cameras).
  - Signature verification is synchronous and happens inside the Redis
    consumer loop; for the detector this adds minimal overhead (one HMAC
    per event) but could become a bottleneck if event rates increase
    dramatically.

risks:
  - If DETECTION_HMAC_KEY is configured but a service restarts before all
    peers have started, the replay cache may not yet exist and initial
    messages could fail verification. The _ReplayCache is initialized at
    import time within each service, so this is unlikely in practice.
  - The migration window (accept unsigned if no key) means a newly
    deployed system with a key is secure, but upgrading from unsigned
    without restarting the detector first could briefly accept unsigned
    messages.

blockers: []

follow_ups:
  - Consider rotating the HMAC key periodically; requires coordinated
    restart and cache clearing across all services.
  - Add monitoring for rejected messages (count of verify failures per
    channel) to detect attack attempts.
  - Evaluate whether MESSAGE_TTL_SECONDS (15s) is appropriate for
    timezones where network latency may be higher.
