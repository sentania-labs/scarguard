# docker-compose.runner.yml
# Runs the GitHub Actions runner on the Orin
#
# Prerequisites:
#   1. Docker + NVIDIA Container Toolkit installed (run orin-setup.sh)
#   2. Copy your "sentania Lab Root 2.crt" into infra/orin-runner/
#   3. Create a .env file (see below)
#
# Usage:
#   cd infra
#   docker compose -f docker-compose.runner.yml up -d --build
#
# Required .env file:
#   RUNNER_TOKEN=<token from GitHub Settings -> Actions -> Runners -> New self-hosted runner>
#   REPO_URL=https://github.com/your-org
#
# Optional .env overrides:
#   RUNNER_NAME=orin-nano
#   RUNNER_LABELS=self-hosted,linux,arm64,jetson

services:
  runner:
    build:
      context: ./orin-runner
    container_name: scarguard-runner
    environment:
      - RUNNER_TOKEN=${RUNNER_TOKEN}
      - RUNNER_NAME=${RUNNER_NAME:-orin-nano}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,linux,arm64,jetson}
      - REPO_URL=${REPO_URL}
      # GitHub is retiring Node 20 action runtimes; runners are Node 24-capable
      - FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
    volumes:
      # Persistent runner config — survives rebuilds, avoids re-registration
      - runner-data:/home/runner
      # Docker socket mount — runner issues commands to host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Timezone sync
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # GPU access for integration tests
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

volumes:
  runner-data: