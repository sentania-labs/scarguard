      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: docker/setup-qemu-action@34e114876b0b11c390a56381ad16ebd13914f8d5  # v3
        with: { version: "3" }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with: { version: "3" }
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build trainer image
        id: build
        run: |
          BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          test -n "$BUILD_DATE"
          docker build --file services/trainer/Dockerfile --tag "$TRAINER_IMAGE:$TAG" \
            --build-arg VERSION="$TAG" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="$BUILD_DATE" .
      - name: Trivy scan - trainer (gating)
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98  # v0
        with:
          image-ref: "$TRAINER_IMAGE:$TAG"
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 40m0s
          sbom-path: trivy-trainer-sbom.spdx.json
      - name: Push trainer image
        id: push
        run: docker push "$TRAINER_IMAGE:$TAG"
      - name: Export trainer digest
        run: echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TRAINER_IMAGE:$TAG" 2>/dev/null || echo "unknown")" >> "$GITHUB_OUTPUT"
      - name: Push latest (trainer)
        continue-on-error: true
        run: |
          docker tag "$TRAINER_IMAGE:$TAG" "$TRAINER_IMAGE:latest"
          docker push "$TRAINER_IMAGE:latest"

  release-detector-x86:
    name: Release detector image (x86)
    needs: [build-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      benchmark_json: ${{ steps.benchmark.outputs.json }}
      digest: ${{ steps.push.digest }}
    env:
      TAG: ${{ github.ref_name }}
      DETECTOR_X86_IMAGE: ghcr.io/${{ github.repository_owner }}/scarguard-detector-x86
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build x86 detector image
        id: build
        run: docker build --file services/detector/Dockerfile.x86 --tag "$DETECTOR_X86_IMAGE:$TAG" .
      - name: Inference benchmark (CPU)
        id: benchmark
        run: |
          cid=$(docker create --user root --entrypoint "" "$DETECTOR_X86_IMAGE:$TAG" python3 /ci/smoke_inference.py)
          docker cp "$GITHUB_WORKSPACE/tests/ci/." "$cid:/ci/"
          OUTPUT=$(docker start -a "$cid")
          rc=$?
          docker rm "$cid" > /dev/null
          echo "$OUTPUT"
          if [ $rc -ne 0 ]; then exit $rc; fi
          BENCH=$(echo "$OUTPUT" | grep '^BENCHMARK_JSON=' | sed 's/^BENCHMARK_JSON=//')
          echo "json=$BENCH" >> "$GITHUB_OUTPUT"
      - name: Trivy scan - detector-x86 (gating)
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98  # v0
        with:
          image-ref: "$DETECTOR_X86_IMAGE:$TAG"
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          timeout: 40m0s
          sbom-path: trivy-detector-x86-sbom.spdx.json
      - name: Push x86 detector image
        id: push
        run: docker push "$DETECTOR_X86_IMAGE:$TAG"
      - name: Export x86 detector digest
        run: echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DETECTOR_X86_IMAGE:$TAG" 2>/dev/null || echo "unknown")" >> "$GITHUB_OUTPUT"
      - name: Push latest (detector-x86)
        continue-on-error: true
        run: |
          docker tag "$DETECTOR_X86_IMAGE:$TAG" "$DETECTOR_X86_IMAGE:latest"
          docker push "$DETECTOR_X86_IMAGE:latest"

  publish-release-digests:
    name: Publish release digests
    needs: [release-web, release-notifier, release-deterrent, release-backup, release-caddy, release-log-streamer, release-training-controller, release-off-watchdog, release-detector, release-detector-x86, release-trainer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digest_json: ${{ steps.write.outputs.digest_json }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Write digest manifest
        id: write
        run: python3 .github/scripts/write-release-digests.py
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          WEB: ${{ needs.release-web.outputs.digest }}
          NOTIFIER: ${{ needs.release-notifier.outputs.digest }}
          DETERRENT: ${{ needs.release-deterrent.outputs.digest }}
          BACKUP: ${{ needs.release-backup.outputs.digest }}
          CADDY: ${{ needs.release-caddy.outputs.digest }}
          LOG_STREAMER: ${{ needs.release-log-streamer.outputs.digest }}
          TRAINING_CONTROLLER: ${{ needs.release-training-controller.outputs.digest }}
          OFF_WATCHDOG: ${{ needs.release-off-watchdog.outputs.digest }}
          DETECTOR: ${{ needs.release-detector.outputs.digest }}
          DETECTOR_X86: ${{ needs.release-detector-x86.outputs.digest }}
          TRAINER: ${{ needs.release-trainer.outputs.digest }}
      - name: Upload digest manifest
        uses: actions/upload-artifact@65c4c4a1ddee5b7296c9c9a97e3c2e026f0a92b3  # v4
        with:
          name: release-digests
          path: release-digests.json
          retention-days: 90

  update-benchmarks:
    name: Update BENCHMARKS.md
    needs: [release-detector, release-detector-x86, publish-release-digests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append benchmark rows
        env:
          TAG: ${{ github.ref_name }}
          ORIN_BENCH: ${{ needs.release-detector.outputs.benchmark_json }}
          X86_BENCH: ${{ needs.release-detector-x86.outputs.benchmark_json }}
        run: |
          python3 .github/scripts/update-benchmarks.py "${{ github.ref_name }}"
      - name: Create benchmark PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "TAG is empty" >&2
            exit 1
          fi
          BRANCH="chore/benchmarks-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md
          git diff --cached --quiet && echo "No benchmark changes" && exit 0
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git commit -m "chore: update BENCHMARKS.md for $TAG"
          git push origin "$BRANCH"
          gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q . \
            || gh pr create --base main --head "$BRANCH" \
              --title "chore: update BENCHMARKS.md for $TAG" \
              --body "Automated benchmark results from release $TAG."

  create-release:
    name: Create GitHub Release
    needs: [update-benchmarks, publish-release-digests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Build release body
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          ORIN_BENCH: ${{ needs.release-detector.outputs.benchmark_json }}
          X86_BENCH: ${{ needs.release-detector-x86.outputs.benchmark_json }}
        run: python3 .github/scripts/build-release-body.py
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          body_path: release_body.md
