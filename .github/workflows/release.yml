  release-detector:
    name: Release detector image (Jetson)
    needs: [build-gate]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: [self-hosted, linux, arm64, jetson]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      benchmark_json: ${{ steps.benchmark.outputs.json }}
      digest: ${{ steps.push.digest }}
    env:
      TAG: ${{ github.ref_name }}
      DETECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/scarguard-detector
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build detector image
        run: docker build --file services/detector/Dockerfile --tag "$DETECTOR_IMAGE:$TAG" .
      - name: Acquire GPU lease (pause detector)
        run: .github/scripts/ci-gpu-lease.sh acquire
      - name: GPU smoke test
        run: |
          docker run --rm --runtime nvidia -e NVIDIA_VISIBLE_DEVICES=all "$DETECTOR_IMAGE:$TAG" \
            python3 -c "import torch; assert torch.cuda.is_available(); print('Smoke test passed')"
      - name: Inference benchmark (GPU)
        id: benchmark
        run: |
          .github/scripts/ci-gpu-lease.sh refresh
          cid=$(docker create --user root --entrypoint "" --runtime nvidia -e NVIDIA_VISIBLE_DEVICES=all "$DETECTOR_IMAGE:$TAG" python3 /ci/smoke_inference.py)
          docker cp "$GITHUB_WORKSPACE/tests/ci/." "$cid:/ci/"
          OUTPUT=$(docker start -a "$cid")
          rc=$?
          docker rm "$cid" > /dev/null
          echo "$OUTPUT"
          if [ $rc -ne 0 ]; then exit $rc; fi
          BENCH=$(echo "$OUTPUT" | grep '^BENCHMARK_JSON=' | sed 's/^BENCHMARK_JSON=//')
          echo "json=$BENCH" >> "$GITHUB_OUTPUT"
      - name: Trivy scan - detector (gating)
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98  # v0
        with:
          image-ref: "$DETECTOR_IMAGE:$TAG"
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 40m0s
          sbom-path: trivy-detector-sbom.spdx.json
      - name: Push detector image
        id: push
        run: docker push "$DETECTOR_IMAGE:$TAG"
      - name: Release GPU lease (resume detector)
        if: always()
        run: .github/scripts/ci-gpu-lease.sh release
      - name: Export detector digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DETECTOR_IMAGE:$TAG" 2>/dev/null || echo "unknown")
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Push latest (detector)
        continue-on-error: true
        run: |
          docker tag "$DETECTOR_IMAGE:$TAG" "$DETECTOR_IMAGE:latest"
          docker push "$DETECTOR_IMAGE:latest"
      - name: Prune stale detector images
        if: always()
        run: |
          docker image prune -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | grep "scarguard-detector" \
            | grep -v ":$TAG" \
            | grep -v ":latest" \
            | awk '{print $2}' \
            | sort -u \
            | xargs -r docker rmi -f || true

