name: Release

# Triggered when a version tag is pushed, e.g. v1.0.0
# Builds all three service images with the semver tag AND updates :latest.
#
# To cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Default token scope: read-only. Image-push jobs elevate to packages: write
# per-job; the benchmark/release jobs elevate to contents: write only where
# they need to commit BENCHMARKS.md or create the GitHub Release.
permissions:
  contents: read

jobs:

  # ── Build & push — web (x86 runner) ─────────────────────────────────────────
  release-web:
    name: Release web image
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Derive version from tag
        id: version
        run: echo "semver=$(echo "$TAG" | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — web
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scarguard-web:latest
          build-args: |
            VERSION=${{ steps.version.outputs.semver }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

  # ── Build & push — notifier (x86 runner) ───────────────────────────────────
  release-notifier:
    name: Release notifier image
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — notifier
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/notifier/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-notifier:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scarguard-notifier:latest
          cache-from: type=gha,scope=notifier
          cache-to: type=gha,scope=notifier,mode=max

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

  # ── Build & push — deterrent (x86 runner) ──────────────────────────────────
  release-deterrent:
    name: Release deterrent image
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — deterrent
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/deterrent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-deterrent:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scarguard-deterrent:latest
          cache-from: type=gha,scope=deterrent
          cache-to: type=gha,scope=deterrent,mode=max

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

  # ── Build & push — backup (x86 runner) ─────────────────────────────────────
  release-backup:
    name: Release backup image
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — backup
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-backup:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scarguard-backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

  # ── Build & push — caddy (x86 runner) ──────────────────────────────────────
  release-caddy:
    name: Release caddy image
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — caddy
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-caddy:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scarguard-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

  # ── Build & push — log-streamer (x86 runner) ───────────────────────────────
  release-log-streamer:
    name: Release log-streamer image
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — log-streamer
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/log-streamer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-log-streamer:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scarguard-log-streamer:latest
          cache-from: type=gha,scope=log-streamer
          cache-to: type=gha,scope=log-streamer,mode=max

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

  # ── Build & push — detector (Orin runner, ARM64) ──────────────────────────
  release-detector:
    name: Release detector image (Jetson)
    runs-on: [self-hosted, linux, arm64, jetson]
    permissions:
      contents: read
      packages: write
    outputs:
      benchmark_json: ${{ steps.benchmark.outputs.json }}

    env:
      TAG: ${{ github.ref_name }}
      DETECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/scarguard-detector

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build detector image
        run: |
          docker build \
            --file services/detector/Dockerfile \
            --tag "$DETECTOR_IMAGE:$TAG" \
            --tag "$DETECTOR_IMAGE:latest" \
            .

      # The Orin's GPU is single-tenant — take the pause-protocol lease so
      # the release benchmark never contends with the live detector or a
      # training run (v1.16.8 release benchmark was cancelled by exactly
      # that contention).
      - name: Acquire GPU lease (pause detector)
        run: .github/scripts/ci-gpu-lease.sh acquire

      - name: GPU smoke test
        run: |
          docker run --rm \
            --runtime nvidia \
            -e NVIDIA_VISIBLE_DEVICES=all \
            "$DETECTOR_IMAGE:$TAG" \
            python3 -c "
          import torch
          assert torch.cuda.is_available(), 'CUDA not available — check NVIDIA runtime'
          name = torch.cuda.get_device_name(0)
          cap  = torch.cuda.get_device_capability(0)
          print(f'GPU : {name}')
          print(f'SM  : {cap[0]}.{cap[1]}')
          print(f'CUDA: {torch.version.cuda}')
          print('Smoke test passed')
          "

      # Uses docker create + cp instead of bind mounts — self-hosted DinD
      # paths don't translate for volume mounts.
      - name: Inference benchmark (GPU)
        id: benchmark
        run: |
          .github/scripts/ci-gpu-lease.sh refresh
          cid=$(docker create --user root --entrypoint "" --runtime nvidia -e NVIDIA_VISIBLE_DEVICES=all \
            "$DETECTOR_IMAGE:$TAG" python3 /ci/smoke_inference.py)
          docker cp "$GITHUB_WORKSPACE/tests/ci/." "$cid:/ci/"
          OUTPUT=$(docker start -a "$cid")
          rc=$?
          docker rm "$cid" > /dev/null
          echo "$OUTPUT"
          if [ $rc -ne 0 ]; then exit $rc; fi
          BENCH=$(echo "$OUTPUT" | grep '^BENCHMARK_JSON=' | sed 's/^BENCHMARK_JSON=//')
          echo "json=$BENCH" >> "$GITHUB_OUTPUT"

      - name: Release GPU lease (resume detector)
        if: always()
        run: .github/scripts/ci-gpu-lease.sh release

      - name: Push detector image
        run: |
          docker push "$DETECTOR_IMAGE:$TAG"
          docker push "$DETECTOR_IMAGE:latest"

      - name: Prune stale detector images
        if: always()
        run: |
          docker image prune -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | grep "scarguard-detector" \
            | grep -v ":$TAG" \
            | grep -v ":latest" \
            | awk '{print $2}' \
            | sort -u \
            | xargs -r docker rmi -f || true

  # ── Build & push — trainer (Orin runner, ARM64) ─────────────────────────────
  # Same L4T base as detector — ARM64 only, built on the Jetson runner.
  release-trainer:
    name: Release trainer image
    runs-on: [self-hosted, linux, arm64, jetson]
    permissions:
      contents: read
      packages: write

    env:
      TAG: ${{ github.ref_name }}
      TRAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/scarguard-trainer

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build trainer image
        run: |
          docker build \
            --file services/trainer/Dockerfile \
            --tag "$TRAINER_IMAGE:$TAG" \
            --tag "$TRAINER_IMAGE:latest" \
            .

      - name: Push trainer image
        run: |
          docker push "$TRAINER_IMAGE:$TAG"
          docker push "$TRAINER_IMAGE:latest"

      - name: Prune
        if: always()
        run: docker image prune -f

  # ── Build & push — detector x86 (x86 runner) ─────────────────────────────
  release-detector-x86:
    name: Release detector image (x86)
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: write
    outputs:
      benchmark_json: ${{ steps.benchmark.outputs.json }}

    env:
      TAG: ${{ github.ref_name }}
      DETECTOR_X86_IMAGE: ghcr.io/${{ github.repository_owner }}/scarguard-detector-x86

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build x86 detector image
        run: |
          docker build \
            --file services/detector/Dockerfile.x86 \
            --tag "$DETECTOR_X86_IMAGE:$TAG" \
            --tag "$DETECTOR_X86_IMAGE:latest" \
            .

      # Uses docker create + cp instead of bind mounts — self-hosted DinD.
      - name: Inference benchmark (CPU)
        id: benchmark
        run: |
          cid=$(docker create --user root --entrypoint "" "$DETECTOR_X86_IMAGE:$TAG" \
            python3 /ci/smoke_inference.py)
          docker cp "$GITHUB_WORKSPACE/tests/ci/." "$cid:/ci/"
          OUTPUT=$(docker start -a "$cid")
          rc=$?
          docker rm "$cid" > /dev/null
          echo "$OUTPUT"
          if [ $rc -ne 0 ]; then exit $rc; fi
          BENCH=$(echo "$OUTPUT" | grep '^BENCHMARK_JSON=' | sed 's/^BENCHMARK_JSON=//')
          echo "json=$BENCH" >> "$GITHUB_OUTPUT"

      - name: Push x86 detector image
        run: |
          docker push "$DETECTOR_X86_IMAGE:$TAG"
          docker push "$DETECTOR_X86_IMAGE:latest"

      - name: Prune
        if: always()
        run: docker image prune -f

  # ── Update benchmark ledger ──────────────────────────────────────────────────
  update-benchmarks:
    name: Update BENCHMARKS.md
    needs: [release-detector, release-detector-x86]
    runs-on: [self-hosted, linux, generic]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append benchmark rows
        env:
          TAG: ${{ github.ref_name }}
          ORIN_BENCH: ${{ needs.release-detector.outputs.benchmark_json }}
          X86_BENCH: ${{ needs.release-detector-x86.outputs.benchmark_json }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          tag = os.environ["TAG"]
          benchmarks = [
              ("Orin", os.environ.get("ORIN_BENCH", "")),
              ("x86", os.environ.get("X86_BENCH", "")),
          ]

          rows = []
          for label, raw in benchmarks:
              if not raw or raw == "null":
                  print(f"WARNING: No benchmark data for {label}, skipping")
                  continue
              try:
                  d = json.loads(raw)
              except json.JSONDecodeError as e:
                  print(f"WARNING: Invalid JSON for {label}: {e}, skipping")
                  continue
              device = d.get("device", "unknown")
              hw = d.get("gpu") if device == "cuda" else d.get("cpu", "unknown")
              notes = "GPU inference" if device == "cuda" else "CPU fallback"
              rows.append(f"| {tag} | {d.get('arch', '?')} | {device} | {hw} | {d.get('fps', '?')} | {notes} |")

          if rows:
              with open("BENCHMARKS.md", "a") as f:
                  for row in rows:
                      f.write(row + "\n")
              print(f"Appended {len(rows)} benchmark row(s)")
          else:
              print("No benchmark rows to append")
          PYEOF

      - name: Create benchmark PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/benchmarks-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md
          git diff --cached --quiet && echo "No benchmark changes" && exit 0
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git commit -m "chore: update BENCHMARKS.md for $TAG

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q . \
            || gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update BENCHMARKS.md for $TAG" \
              --body "Automated benchmark results from release $TAG."
          gh pr edit "$BRANCH" --add-label ci 2>/dev/null || true

  # ── Create GitHub Release ──────────────────────────────────────────────────
  # Waits for all image builds to succeed, then creates a GitHub Release
  # with auto-generated notes so there's a visible changelog on the repo.
  create-release:
    name: Create GitHub Release
    needs: [release-web, release-notifier, release-deterrent, release-backup, release-caddy, release-log-streamer, release-detector, release-detector-x86, release-trainer]
    runs-on: [self-hosted, linux, generic]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Build release body
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          ORIN_BENCH: ${{ needs.release-detector.outputs.benchmark_json }}
          X86_BENCH: ${{ needs.release-detector-x86.outputs.benchmark_json }}
        run: |
          python3 << 'PYEOF' > release_body.md
          import json, os, textwrap

          tag = os.environ["TAG"]
          owner = os.environ["OWNER"]

          print(textwrap.dedent(f"""\
          ## Docker Images

          Pull and run this release:

          ```bash
          # In your .env file, set:
          IMAGE_TAG={tag}

          docker compose pull
          docker compose up -d
          ```

          Or update a running installation:
          ```bash
          echo "IMAGE_TAG={tag}" >> .env
          docker compose pull && docker compose up -d
          ```

          ## Images

          | Service | Image | Platform |
          |---------|-------|----------|
          | detector (Jetson) | `ghcr.io/{owner}/scarguard-detector:{tag}` | ARM64 / L4T |
          | detector (x86) | `ghcr.io/{owner}/scarguard-detector-x86:{tag}` | x86_64 (CUDA + CPU) |
          | web | `ghcr.io/{owner}/scarguard-web:{tag}` | amd64, arm64 |
          | notifier | `ghcr.io/{owner}/scarguard-notifier:{tag}` | amd64, arm64 |
          | deterrent | `ghcr.io/{owner}/scarguard-deterrent:{tag}` | amd64, arm64 |
          | backup | `ghcr.io/{owner}/scarguard-backup:{tag}` | amd64, arm64 |
          | caddy | `ghcr.io/{owner}/scarguard-caddy:{tag}` | amd64, arm64 |
          | log-streamer | `ghcr.io/{owner}/scarguard-log-streamer:{tag}` | amd64, arm64 |
          | trainer | `ghcr.io/{owner}/scarguard-trainer:{tag}` | ARM64 / L4T |

          ## Benchmarks

          | Arch | Device | Hardware | FPS | Notes |
          |------|--------|----------|-----|-------|"""))

          for label, raw in [("Orin", os.environ.get("ORIN_BENCH", "")),
                             ("x86", os.environ.get("X86_BENCH", ""))]:
              if not raw or raw == "null":
                  continue
              try:
                  d = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              device = d.get("device", "unknown")
              hw = d.get("gpu") if device == "cuda" else d.get("cpu", "unknown")
              notes = "GPU inference" if device == "cuda" else "CPU fallback"
              print(f"| {d.get('arch', '?')} | {device} | {hw} | {d.get('fps', '?')} | {notes} |")

          print()
          print("See [BENCHMARKS.md](BENCHMARKS.md) for full benchmark history.")
          PYEOF

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          body_path: release_body.md
