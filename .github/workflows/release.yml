name: Release

# Triggered when an annotated version tag is pushed, e.g. git tag -a v1.0.0 && git push origin v1.0.0
# Requires an annotated tag (not lightweight) so the provenance chain is verifiable.
#
# Build-once policy: every image is built a single time; the same digest is tested,
# scanned, and pushed. No re-build.  :latest is only updated after all image jobs
# pass their scan + SBOM gates.
#
# To cut a release:
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Default token scope: read-only. Image-push jobs elevate to packages: write
# per-job; the benchmark/release jobs elevate to contents: write only where
# they need to commit BENCHMARKS.md or create the GitHub Release.
permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  tag-gate:
    name: Tag provenance check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Verify tag is annotated
        run: |
          TAG="${{ github.ref_name }}"
          TYPE=$(git cat-file -t "$TAG" 2>/dev/null) || { echo "FAIL: $TAG does not exist" >&2; exit 1; }
          if [ "$TYPE" != "tag" ]; then
            echo "FAIL: $TAG is $TYPE, not an annotated tag" >&2
            exit 1
          fi
          echo "Tag $TAG is annotated ($TYPE) - provenance OK"

  build-gate:
    name: Build workflow gate
    needs: [tag-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check build.yml status for this commit
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" | \
          python3 .github/scripts/check-build-status.py
        env:
          BUILD_NAME_FILTER: "Build"

  release-web:
    name: Release web image
    needs: [build-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Derive version from tag
        id: version
        run: echo "semver=$(echo "${{ github.ref_name }}" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@34e114876b0b11c390a56381ad16ebd13914f8d5  # v3
        with: { version: "3" }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with: { version: "3" }
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push - web
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/scarguard-web:${{ github.ref_name }}
          build-args: |
            VERSION=${{ steps.version.outputs.semver }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Trivy scan - web (gating)
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98  # v0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/scarguard-web:${{ github.ref_name }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 20m0s
          sbom-path: trivy-web-sbom.spdx.json
      - name: Push latest (web)
        continue-on-error: true
        run: docker buildx imagetools create --tag "ghcr.io/${{ github.repository_owner }}/scarguard-web:latest" "ghcr.io/${{ github.repository_owner }}/scarguard-web:${{ github.ref_name }}"

