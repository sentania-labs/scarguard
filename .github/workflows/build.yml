name: Build

# Validates that all Docker images build successfully on every PR and merge.
# Catches Dockerfile / dependency issues before they block a release.
#
# Pipeline:
#   1. Multi-arch build (amd64 + arm64) — validates Dockerfiles
#   2. Single-arch load (amd64) — loads images for testing and scanning
#   3. Container pytest — runs tests inside built images to catch import/dep issues
#   4. Trivy scan — fails on CRITICAL/HIGH CVEs with known fixes
#
# Images are built but NOT pushed — this is a build-only validation.
# Versioned releases and GHCR pushes are handled by release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Build web + notifier (x86 runner) ────────────────────────────────────────
  build-web-notifier:
    name: Build web + notifier images
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build web (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build notifier (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notifier/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=notifier
          cache-to: type=gha,scope=notifier,mode=max

      - name: Build caddy (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      # Single-platform build loaded into local Docker for testing and Trivy
      # scanning.  Uses the default docker driver (not buildx) to avoid
      # BuildKit's persistent layer cache on self-hosted runners, which can
      # serve stale layers even after Dockerfile changes.
      - name: Build web (amd64, load for test)
        run: |
          docker build \
            --tag scarguard-web:test \
            --file services/web/Dockerfile \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=${{ github.event.head_commit.timestamp }} \
            .

      # Uses docker create + cp instead of bind mounts (-v) because the
      # self-hosted runner uses Docker-in-Docker.  Bind mount paths reference
      # the outer host filesystem, not the runner container's filesystem,
      # causing empty mount directories inside the test container.
      - name: Test web in container
        run: |
          cid=$(docker create scarguard-web:test sh -c "pip install --quiet pytest httpx && python3 -m pytest /app/tests/ -v --tb=short")
          docker cp ${{ github.workspace }}/services/web/tests/. "$cid:/app/tests/"
          docker cp ${{ github.workspace }}/shared/. "$cid:/app/shared/"
          docker start -a "$cid"
          rc=$?
          docker rm "$cid" > /dev/null
          exit $rc

      - name: Build notifier (amd64, load for test)
        run: |
          docker build \
            --tag scarguard-notifier:test \
            --file services/notifier/Dockerfile \
            .

      - name: Test notifier in container
        run: |
          cid=$(docker create scarguard-notifier:test sh -c "pip install --quiet pytest && python3 -m pytest /app/tests/ -v --tb=short")
          docker cp ${{ github.workspace }}/services/notifier/tests/. "$cid:/app/tests/"
          docker cp ${{ github.workspace }}/shared/. "$cid:/app/shared/"
          docker start -a "$cid"
          rc=$?
          docker rm "$cid" > /dev/null
          exit $rc

      - name: Trivy scan — web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scarguard-web:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan — notifier
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scarguard-notifier:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Clean up test images
        if: always()
        run: |
          docker rmi scarguard-web:test scarguard-notifier:test || true

  # ── Build detector — Jetson/L4T (Orin runner, ARM64) ─────────────────────────
  build-detector:
    name: Build detector image (Jetson)
    runs-on: [self-hosted, linux, arm64, jetson]

    steps:
      - uses: actions/checkout@v4

      - name: Build detector image (validate only, no push)
        run: |
          docker build \
            --file services/detector/Dockerfile \
            --tag scarguard-detector:build-validate \
            .

      - name: GPU smoke test
        run: |
          docker run --rm \
            --runtime nvidia \
            -e NVIDIA_VISIBLE_DEVICES=all \
            scarguard-detector:build-validate \
            python3 -c "
          import torch
          assert torch.cuda.is_available(), 'CUDA not available — check NVIDIA runtime'
          print(f'GPU:  {torch.cuda.get_device_name(0)}')
          print(f'SM:   {torch.cuda.get_device_capability(0)}')
          print(f'CUDA: {torch.version.cuda}')
          print('GPU smoke test passed')
          "

      - name: Inference benchmark (GPU)
        run: |
          docker run --rm \
            --runtime nvidia \
            -e NVIDIA_VISIBLE_DEVICES=all \
            -v ${{ github.workspace }}/tests/ci:/ci:ro \
            scarguard-detector:build-validate \
            python3 /ci/smoke_inference.py

      - name: Clean up build-validate image
        if: always()
        run: docker rmi scarguard-detector:build-validate || true

  # ── Build detector — x86 CUDA+CPU (x86 runner) ─────────────────────────────
  build-detector-x86:
    name: Build detector image (x86)
    runs-on: [self-hosted, linux, docker]

    steps:
      - uses: actions/checkout@v4

      - name: Build x86 detector image
        run: |
          docker build \
            --file services/detector/Dockerfile.x86 \
            --tag scarguard-detector-x86:build-validate \
            .

      - name: Inference benchmark (CPU)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/ci:/ci:ro \
            scarguard-detector-x86:build-validate \
            python3 /ci/smoke_inference.py

      - name: Trivy scan — detector-x86
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scarguard-detector-x86:build-validate
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Clean up
        if: always()
        run: docker rmi scarguard-detector-x86:build-validate || true

  # ── Compose smoke test (x86 runner) ─────────────────────────────────────────
  compose-smoke-test:
    name: Compose smoke test
    needs: [build-detector-x86, build-web-notifier]
    runs-on: [self-hosted, linux, docker]

    steps:
      - uses: actions/checkout@v4

      - name: Build all images locally
        run: |
          docker build -f services/detector/Dockerfile.x86 -t scarguard-detector-x86:smoke .
          docker build -f services/web/Dockerfile -t scarguard-web:smoke \
            --build-arg GIT_COMMIT=${{ github.sha }} .
          docker build -f services/notifier/Dockerfile -t scarguard-notifier:smoke .
          docker build -f services/caddy/Dockerfile -t scarguard-caddy:smoke .

      - name: Seed config volume
        run: |
          docker volume create smoke-config 2>/dev/null || true
          docker run --rm \
            -v smoke-config:/config \
            -v ${{ github.workspace }}/config:/src:ro \
            alpine:3.20 sh -c 'cp /src/scarguard.example.yml /config/scarguard.yml && mkdir -p /config/certs'

      - name: Start stack (CPU mode)
        env:
          COMPOSE_FILE: docker-compose.yml
          DETECTOR_IMAGE: scarguard-detector-x86
          IMAGE_TAG: smoke
          GHCR_OWNER: ""
        run: docker compose up -d

      - name: Health checks
        env:
          COMPOSE_FILE: docker-compose.yml
          DETECTOR_IMAGE: scarguard-detector-x86
          IMAGE_TAG: smoke
          GHCR_OWNER: ""
        run: |
          REDIS_OK=false
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping 2>/dev/null; then
              REDIS_OK=true
              break
            fi
            sleep 2
          done
          if [ "$REDIS_OK" != "true" ]; then
            echo "FAIL: Redis did not become healthy within 60s"
            docker compose logs redis 2>&1 | tail -20
            exit 1
          fi

          WEB_OK=false
          echo "Waiting for web /health..."
          for i in $(seq 1 30); do
            if docker compose exec -T web python3 -c "
          import urllib.request
          r = urllib.request.urlopen('http://localhost:8080/health')
          print(f'Web health: {r.status}')
          " 2>/dev/null; then
              WEB_OK=true
              break
            fi
            sleep 2
          done
          if [ "$WEB_OK" != "true" ]; then
            echo "FAIL: Web /health did not respond within 60s"
            docker compose logs web 2>&1 | tail -20
            exit 1
          fi

          echo "Checking detector logs..."
          docker compose logs detector 2>&1 | tail -20

      - name: Tear down
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml
          DETECTOR_IMAGE: scarguard-detector-x86
          IMAGE_TAG: smoke
          GHCR_OWNER: ""
        run: |
          docker compose down -v || true
          docker volume rm smoke-config 2>/dev/null || true
          docker rmi scarguard-detector-x86:smoke scarguard-web:smoke \
            scarguard-notifier:smoke scarguard-caddy:smoke 2>/dev/null || true
