name: Build

# Validates that all Docker images build successfully on every merge to main.
# Catches Dockerfile / dependency issues before they block a release.
#
# Images are built but NOT pushed — this is a build-only validation.
# Versioned releases and GHCR pushes are handled by release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Build web + notifier (x86 runner) ────────────────────────────────────────
  build-web-notifier:
    name: Build web + notifier images
    runs-on: [self-hosted, linux, docker]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build web (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build notifier (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notifier/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=notifier
          cache-to: type=gha,scope=notifier,mode=max

      - name: Build caddy (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Build web (amd64, load for test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: scarguard-web:test
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=web

      - name: Test web in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/web/tests:/app/tests \
            -v ${{ github.workspace }}/shared:/app/shared \
            scarguard-web:test \
            sh -c "pip install --quiet pytest httpx && ls -la /app/tests/ && python3 -m pytest /app/tests/ -v --tb=short -p no:cacheprovider 2>&1 || (echo '--- COLLECTION ERRORS ---' && python3 -m pytest /app/tests/ --collect-only 2>&1; exit 1)"

      - name: Build notifier (amd64, load for test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notifier/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: scarguard-notifier:test
          cache-from: type=gha,scope=notifier

      - name: Test notifier in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/notifier/tests:/app/tests \
            -v ${{ github.workspace }}/shared:/app/shared \
            scarguard-notifier:test \
            sh -c "pip install --quiet pytest && python3 -m pytest /app/tests/ -v --tb=short 2>&1"

      - name: Trivy scan — web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scarguard-web:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan — notifier
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scarguard-notifier:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Clean up test images
        if: always()
        run: |
          docker rmi scarguard-web:test scarguard-notifier:test || true

  # ── Build detector (Orin runner, ARM64) ───────────────────────────────────────
  build-detector:
    name: Build detector image
    runs-on: [self-hosted, linux, arm64, jetson]

    steps:
      - uses: actions/checkout@v4

      - name: Build detector image (validate only, no push)
        run: |
          docker build \
            --file services/detector/Dockerfile \
            --tag scarguard-detector:build-validate \
            .

      - name: Clean up build-validate image
        if: always()
        run: docker rmi scarguard-detector:build-validate || true
