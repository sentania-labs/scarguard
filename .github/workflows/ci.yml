name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Ruff is a static analyser — no packages need to be installed.
  # We lint all services including detector (where GPU deps aren't available).
  lint:
    name: Lint (ruff)
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: |
          ruff check \
            services/detector/src \
            services/web/src \
            services/notifier/src \
            shared

  # ── Type check ──────────────────────────────────────────────────────────────
  # Detector is excluded — it requires torch/opencv/ultralytics which are
  # only available on the L4T base image (ARM64, CUDA).
  typecheck:
    name: Type check (mypy)
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install mypy types-PyYAML types-requests \
            -r services/web/requirements.txt \
            -r services/notifier/requirements.txt

      - name: mypy — web
        env:
          MYPYPATH: services/web/src:shared
        run: |
          mypy services/web/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

      - name: mypy — notifier
        env:
          MYPYPATH: services/notifier/src:shared
        run: |
          mypy services/notifier/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

  # ── Tests — web ─────────────────────────────────────────────────────────────
  test-web:
    name: Tests — web
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r services/web/requirements.txt pytest httpx

      - name: pytest
        env:
          PYTHONPATH: services/web/src:shared
        run: pytest services/web/tests/ -v

  # ── Tests — notifier ────────────────────────────────────────────────────────
  test-notifier:
    name: Tests — notifier
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r services/notifier/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/notifier/src:shared
        run: pytest services/notifier/tests/ -v

  # ── Build & push — web + notifier ───────────────────────────────────────────
  # Only runs on push to main (not PRs). Requires all quality gates to pass.
  # Detector is built and pushed by the Orin runner in deploy.yml.
  build-push:
    name: Build & push images
    runs-on: [self-hosted, linux, generic]
    needs: [lint, typecheck, test-web, test-notifier]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-web:latest
            ghcr.io/${{ github.repository_owner }}/scarguard-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push — notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notifier/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-notifier:latest
            ghcr.io/${{ github.repository_owner }}/scarguard-notifier:sha-${{ github.sha }}
          cache-from: type=gha,scope=notifier
          cache-to: type=gha,scope=notifier,mode=max
