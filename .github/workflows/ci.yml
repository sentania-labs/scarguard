name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default token scope: read-only. No job in this workflow needs to write to
# the repo, packages, or any other GitHub-controlled resource.
permissions:
  contents: read

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Ruff is a static analyser — no packages need to be installed.
  # We lint all services including detector (where GPU deps aren't available).
  lint:
    name: Lint (ruff)
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: |
          ruff check \
            services/detector/src \
            services/web/src \
            services/notifier/src \
            services/deterrent/src \
            services/log-streamer/src \
            services/trainer/src \
            services/training-controller/src \
            shared \
            training

  # ── Type check ──────────────────────────────────────────────────────────────
  # Detector is excluded — it requires torch/opencv/ultralytics which are
  # only available on the L4T base image (ARM64, CUDA).
  typecheck:
    name: Type check (mypy)
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install mypy types-PyYAML types-requests \
            -r services/web/requirements.txt \
            -r services/notifier/requirements.txt \
            -r services/deterrent/requirements.txt

      - name: mypy — web
        env:
          MYPYPATH: services/web/src:shared
        run: |
          mypy services/web/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

      - name: mypy — notifier
        env:
          MYPYPATH: services/notifier/src:shared
        run: |
          mypy services/notifier/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

      - name: mypy — deterrent
        env:
          MYPYPATH: services/deterrent/src:shared
        run: |
          mypy services/deterrent/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

  # ── Tests — web ─────────────────────────────────────────────────────────────
  test-web:
    name: Tests — web
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/web/requirements.txt pytest httpx

      - name: pytest
        env:
          PYTHONPATH: services/web/src:shared
        run: pytest services/web/tests/ -v

  # ── Tests — notifier ────────────────────────────────────────────────────────
  test-notifier:
    name: Tests — notifier
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/notifier/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/notifier/src:shared
        run: pytest services/notifier/tests/ -v

  # ── Tests — deterrent ──────────────────────────────────────────────────────
  test-deterrent:
    name: Tests — deterrent
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/deterrent/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/deterrent/src:shared
        run: pytest services/deterrent/tests/ -v

  # ── Tests — training ────────────────────────────────────────────────────────
  # prepare_dataset.py keeps its heavy imports (roboflow, requests, yaml)
  # function-local, so the class-handling unit tests run on stdlib + pytest.
  test-training:
    name: Tests — training
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pytest

      - name: pytest
        run: pytest training/tests/ -v

  # ── Tests — trainer execution + lifecycle controller ──────────────────────
  # These use fake children, fake cgroup evidence, and a fake Docker backend.
  # They never contact the production Orin or drive a live detector.
  test-training-runtime:
    name: Tests — training runtime
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pytest redis -r services/training-controller/requirements.txt

      - name: Trainer fake-child and evidence tests
        env:
          PYTHONPATH: services/trainer/src:shared
        run: pytest services/trainer/tests/ -v

      - name: Lifecycle controller ownership tests
        env:
          PYTHONPATH: services/training-controller/src
        run: pytest services/training-controller/tests/ -v
