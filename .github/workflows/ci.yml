name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default token scope: read-only. No job in this workflow needs to write to
# the repo, packages, or any other GitHub-controlled resource.
permissions:
  contents: read

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Ruff is a static analyser - no packages need to be installed.
  # We lint all services including detector (where GPU deps aren't available).
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.7

      - name: Ruff check
        run: scripts/lint.sh

  # ── Type check ──────────────────────────────────────────────────────────────
  # Detector is excluded - it requires torch/opencv/ultralytics which are
  # only available on the L4T base image (ARM64, CUDA).
  # Each service gets its own venv so that differing requirement versions
  # across services never clash (e.g. redis 7.x vs 8.x from dependabot).
  typecheck:
    name: Type check (mypy) - ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    strategy:
      matrix:
        service: [web, notifier, deterrent]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Create isolated venv
        run: python3 -m venv .venv

      - name: Activate venv and install deps
        run: |
          source .venv/bin/activate
          pip install mypy types-PyYAML types-requests \
            -r services/${{ matrix.service }}/requirements.txt

      - name: mypy - ${{ matrix.service }}
        env:
          MYPYPATH: services/${{ matrix.service }}/src:shared
          PATH: "${{ github.workspace }}/.venv/bin:$PATH"
        run: |
          mypy services/${{ matrix.service }}/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

  # ── Tests - web ─────────────────────────────────────────────────────────────
  test-web:
    name: Tests - web
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/web/requirements.txt pytest httpx

      - name: pytest
        env:
          PYTHONPATH: services/web/src:shared
        run: pytest services/web/tests/ -v

      - name: Install browser test tools
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Event review and read-only browser regressions
        env:
          PYTHONPATH: services/web/src:shared
          SCARGUARD_BROWSER_TESTS: "1"
        run: pytest services/web/tests/test_events_browser.py -v


  # ── Tests - notifier ────────────────────────────────────────────────────────
  test-notifier:
    name: Tests - notifier
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/notifier/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/notifier/src:shared
        run: pytest services/notifier/tests/ -v

  # ── Tests - deterrent ──────────────────────────────────────────────────────
  test-deterrent:
    name: Tests - deterrent
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/deterrent/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/deterrent/src:shared
        run: pytest services/deterrent/tests/ -v

  # ── Tests - log-streamer ────────────────────────────────────────────────────
  test-log-streamer:
    name: Tests - log-streamer
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r services/log-streamer/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/log-streamer/src:shared
        run: pytest services/log-streamer/tests/ -v

  # ── Tests - training ────────────────────────────────────────────────────────
  # prepare_dataset.py keeps its heavy imports (roboflow, requests, yaml)
  # function-local, so the class-handling unit tests run on stdlib + pytest.
  test-training:
    name: Tests - training
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pytest

      - name: pytest
        run: pytest training/tests/ -v

  # ── Tests - trainer execution + lifecycle controller ──────────────────────
  # These use fake children, fake cgroup evidence, and a fake Docker backend.
  # They never contact the production Orin or drive a live detector.
  test-training-runtime:
    name: Tests - training runtime
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pytest redis -r services/training-controller/requirements.txt -r services/trainer/requirements.txt

      - name: Trainer fake-child and evidence tests
        env:
          PYTHONPATH: services/trainer/src:shared
        run: pytest services/trainer/tests/ -v

      - name: Lifecycle controller ownership tests
        env:
          PYTHONPATH: services/training-controller/src
        run: pytest services/training-controller/tests/ -v
