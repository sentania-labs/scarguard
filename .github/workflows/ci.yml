name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Ruff is a static analyser — no packages need to be installed.
  # We lint all services including detector (where GPU deps aren't available).
  lint:
    name: Lint (ruff)
    runs-on: [self-hosted, linux, genric]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: |
          ruff check \
            services/detector/src \
            services/web/src \
            services/notifier/src \
            shared

  # ── Type check ──────────────────────────────────────────────────────────────
  # Detector is excluded — it requires torch/opencv/ultralytics which are
  # only available on the L4T base image (ARM64, CUDA).
  typecheck:
    name: Type check (mypy)
    runs-on: [self-hosted, linux, genric]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install mypy types-PyYAML types-requests \
            -r services/web/requirements.txt \
            -r services/notifier/requirements.txt

      - name: mypy — web
        env:
          MYPYPATH: services/web/src:shared
        run: |
          mypy services/web/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

      - name: mypy — notifier
        env:
          MYPYPATH: services/notifier/src:shared
        run: |
          mypy services/notifier/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

  # ── Tests — web ─────────────────────────────────────────────────────────────
  test-web:
    name: Tests — web
    runs-on: [self-hosted, linux, genric]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r services/web/requirements.txt pytest httpx

      - name: pytest
        env:
          PYTHONPATH: services/web/src:shared
        run: pytest services/web/tests/ -v

  # ── Tests — notifier ────────────────────────────────────────────────────────
  test-notifier:
    name: Tests — notifier
    runs-on: [self-hosted, linux, genric]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r services/notifier/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/notifier/src:shared
        run: pytest services/notifier/tests/ -v

  # ── Build & push — web + notifier ───────────────────────────────────────────
  # Only runs on push to main (not PRs). Requires all quality gates to pass.
  build-push:
    name: Build & push images
    runs-on: [self-hosted, linux, docker]
    needs: [lint, typecheck, test-web, test-notifier]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-web:latest
            ghcr.io/${{ github.repository_owner }}/scarguard-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push — notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notifier/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scarguard-notifier:latest
            ghcr.io/${{ github.repository_owner }}/scarguard-notifier:sha-${{ github.sha }}
          cache-from: type=gha,scope=notifier
          cache-to: type=gha,scope=notifier,mode=max

  # ── Build & push — detector (Orin runner, ARM64) ────────────────────────────
  # Must run on the Orin: L4T base image is ARM64-only and TensorRT engine files
  # are architecture-specific. Docker socket is mounted from host so the smoke
  # test can reach the GPU without nested containers.
  # Only runs on push to main (not PRs).
  build-push-detector:
    name: Build & push detector image
    runs-on: [self-hosted, linux, arm64, jetson]
    needs: [lint, typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    env:
      DETECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/scarguard-detector

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build detector image
        run: |
          docker build \
            --file services/detector/Dockerfile \
            --tag ${{ env.DETECTOR_IMAGE }}:latest \
            --tag ${{ env.DETECTOR_IMAGE }}:sha-${{ github.sha }} \
            .

      # Verifies CUDA is accessible inside the new image before pushing.
      - name: GPU smoke test
        run: |
          docker run --rm \
            --runtime nvidia \
            -e NVIDIA_VISIBLE_DEVICES=all \
            ${{ env.DETECTOR_IMAGE }}:latest \
            python - <<'EOF'
          import torch
          assert torch.cuda.is_available(), "CUDA not available — check NVIDIA runtime"
          name = torch.cuda.get_device_name(0)
          cap  = torch.cuda.get_device_capability(0)
          print(f"GPU : {name}")
          print(f"SM  : {cap[0]}.{cap[1]}")
          print(f"CUDA: {torch.version.cuda}")
          print("Smoke test passed")
          EOF

      - name: Push detector image
        run: |
          docker push ${{ env.DETECTOR_IMAGE }}:latest
          docker push ${{ env.DETECTOR_IMAGE }}:sha-${{ github.sha }}

      # Restore detector regardless of smoke test / push outcome.
      - name: Restart detector
        if: always()
        run: docker compose start detector || true
