name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Ruff is a static analyser — no packages need to be installed.
  # We lint all services including detector (where GPU deps aren't available).
  lint:
    name: Lint (ruff)
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: |
          ruff check \
            services/detector/src \
            services/web/src \
            services/notifier/src \
            shared

  # ── Type check ──────────────────────────────────────────────────────────────
  # Detector is excluded — it requires torch/opencv/ultralytics which are
  # only available on the L4T base image (ARM64, CUDA).
  typecheck:
    name: Type check (mypy)
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install mypy types-PyYAML types-requests \
            -r services/web/requirements.txt \
            -r services/notifier/requirements.txt

      - name: mypy — web
        env:
          MYPYPATH: services/web/src:shared
        run: |
          mypy services/web/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

      - name: mypy — notifier
        env:
          MYPYPATH: services/notifier/src:shared
        run: |
          mypy services/notifier/src shared \
            --ignore-missing-imports \
            --explicit-package-bases

  # ── Tests — web ─────────────────────────────────────────────────────────────
  test-web:
    name: Tests — web
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r services/web/requirements.txt pytest httpx

      - name: pytest
        env:
          PYTHONPATH: services/web/src:shared
        run: pytest services/web/tests/ -v

  # ── Tests — notifier ────────────────────────────────────────────────────────
  test-notifier:
    name: Tests — notifier
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r services/notifier/requirements.txt pytest

      - name: pytest
        env:
          PYTHONPATH: services/notifier/src:shared
        run: pytest services/notifier/tests/ -v

  # ── Version check ─────────────────────────────────────────────────────────
  version-check:
    name: VERSION file check
    runs-on: [self-hosted, linux, generic]
    steps:
      - uses: actions/checkout@v4

      - name: Validate VERSION file
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION file is empty"
            exit 1
          fi
          echo "VERSION: $VERSION"
