name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Affected service
      options:
        - Web UI
        - Detector
        - Notifier
        - Docker Compose / Setup
        - Other
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: "What are you running ScarGuard on?"
      placeholder: "Jetson Orin Nano, JetPack 6.2.1 / x86 Ubuntu 24.04, RTX 3060"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ScarGuard version
      description: "Check the About page or run: cat VERSION"
      placeholder: "v0.8 / dev / git commit hash"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output (Admin > Logs, or `docker compose logs`).
      render: shell
    validations:
      required: false
