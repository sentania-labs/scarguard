name: scarguard

# Image names are built locally or pulled from GHCR.
# Set GHCR_OWNER (e.g. your GitHub org/user) in a .env file or environment.
# IMAGE_TAG defaults to "latest".
#
#   echo "GHCR_OWNER=myorg" > .env
#
# To build locally:   docker compose build
# To pull from GHCR:  docker compose pull
# To run:             docker compose up -d
# TLS is handled by the Caddy reverse proxy - see tls section in scarguard.yml

services:

  # ── Volume init (one-shot migration helper) ───────────────────────────────
  # v1.14.2 upgrade migration: chown the redis-data and caddy-data volumes
  # to uid 999 so the non-root redis/caddy containers can read pre-existing
  # files written by the old root-user containers (any install from 0.13.x,
  # v1.14.0, or v1.14.1). Runs to completion on every `up` - chown is
  # idempotent, so steady-state is a no-op (~0.5s). Redis and caddy gate on
  # this via `service_completed_successfully` so they never start ahead of it.
  #
  # RETIREMENT: remove in v1.16, and no earlier than 2026-10-23 (six months
  # after v1.14.2 ship date) - whichever is later. After retirement, the
  # rare stale-installer upgrading from a pre-v1.14.2 volume gets a
  # one-time manual chown instruction (see README "Upgrading from a
  # previous version"). Fresh v1.14.2+ installs never needed this.
  volume-init:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    # `set -e` + no error suppression: if chown actually fails (e.g., a
    # volume backend that rejects the op), the sidecar exits non-zero,
    # the `service_completed_successfully` gate on redis/caddy fails,
    # and the stack refuses to start with a clear error - preferable to
    # redis/caddy booting against unchanged ownership and hitting the
    # same permission wall the sidecar was meant to prevent.
    #
    # /config is included because manual-TLS users (README: Enabling
    # HTTPS → Mode 3) copy `cert.pem`/`key.pem` into /config/certs via a
    # root `docker run`, producing root:root mode 600 files that a
    # non-root caddy can't read. Every service that touches /config
    # runs as uid 999, so recursive chown is safe.
    command: >-
      sh -euc 'chown -R 999:999 /redis /caddy /config;
               echo "volume-init: ownership set to 999:999 on /redis, /caddy, /config"'
    volumes:
      - redis-data:/redis
      - scarguard-caddy-data:/caddy
      - scarguard-config:/config
    restart: "no"
    mem_limit: 32m
    pids_limit: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Run as the non-root `redis` user built into the alpine image (uid 999).
    # The image's entrypoint only drops privileges when arg[0] is
    # `redis-server`; our `sh -c` wrapper defeats that path, so we pin the
    # uid explicitly here. Existing deployments must chown the redis-data
    # volume to 999:999 once before upgrading - handled automatically by
    # the volume-init service above.
    user: "999:999"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # v1.16 (FDY-0563): per-service ACL users. config/redis-entrypoint.sh
    # turns config/redis-acl.conf plus the REDIS_PASSWORD_<SERVICE> secrets
    # below into an aclfile (SHA-256 digests only) and starts redis-server
    # with --maxmemory 200mb --maxmemory-policy noeviction. Pause/rearm,
    # trainer heartbeat, rate-limit quotas and OFF-watchdog leases therefore
    # can never be evicted; under memory pressure writes fail and callers
    # fail closed. REDIS_PASSWORD is the "default" (admin) user and is given
    # to no other container; the healthcheck and operator `docker exec`
    # sessions use it. A missing service credential disables that user
    # (fail closed) - run scripts/migrate-redis-acl.sh.
    command: ["sh", "/scarguard/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PASSWORD_DETECTOR: ${REDIS_PASSWORD_DETECTOR:-}
      REDIS_PASSWORD_WEB: ${REDIS_PASSWORD_WEB:-}
      REDIS_PASSWORD_NOTIFIER: ${REDIS_PASSWORD_NOTIFIER:-}
      REDIS_PASSWORD_DETERRENT: ${REDIS_PASSWORD_DETERRENT:-}
      REDIS_PASSWORD_OFF_WATCHDOG: ${REDIS_PASSWORD_OFF_WATCHDOG:-}
      REDIS_PASSWORD_BACKUP: ${REDIS_PASSWORD_BACKUP:-}
      REDIS_PASSWORD_LOG_STREAMER: ${REDIS_PASSWORD_LOG_STREAMER:-}
      REDIS_PASSWORD_TRAINING_CONTROLLER: ${REDIS_PASSWORD_TRAINING_CONTROLLER:-}
      REDIS_PASSWORD_TRAINER: ${REDIS_PASSWORD_TRAINER:-}
    healthcheck:
      test: >-
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping;
        else
          redis-cli ping;
        fi'
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
      - ./config/redis-entrypoint.sh:/scarguard/redis-entrypoint.sh:ro
      - ./config/redis-acl.conf:/scarguard/redis-acl.conf:ro
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default            # all regular services
      - scarguard-training  # training controller + trainer need Redis

  # ── Caddy reverse proxy ───────────────────────────────────────────────────
  # Front door for all HTTP(S) traffic.  Reads tls config from scarguard.yml
  # and generates a Caddyfile at startup (and on config changes via mtime poll).
  caddy:
    build:
      context: .
      dockerfile: services/caddy/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-caddy:${IMAGE_TAG:-latest}
    # Run as uid 999 to match scarguard.yml's owner (all other services do
    # the same). This removes the prior reliance on DAC_OVERRIDE /
    # DAC_READ_SEARCH to bypass unix perms. The upstream caddy:2-alpine
    # image already ships /usr/bin/caddy with cap_net_bind_service=ep, so
    # the non-root user can still bind :80/:443. Existing deployments
    # must chown the
    # scarguard-caddy-data volume to 999:999 once before upgrading.
    user: "999:999"
    ports:
      # Falls back to legacy WEB_PORT / WEB_HTTPS_PORT for in-place upgrades.
      - "${HTTP_PORT:-${WEB_PORT:-80}}:80"
      - "${HTTPS_PORT:-${WEB_HTTPS_PORT:-443}}:443"
    volumes:
      - scarguard-caddy-data:/data        # Let's Encrypt cert storage
      - scarguard-config:/config:ro       # reads scarguard.yml + manual certs
    environment:
      CONFIG_PATH: /config/scarguard.yml
      HTTPS_PORT: ${HTTPS_PORT:-${WEB_HTTPS_PORT:-443}}
      XDG_CONFIG_HOME: /data/caddy/config
    depends_on:
      web:
        condition: service_started
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Caddy binds 80/443. The upstream caddy:2-alpine image already
      # ships /usr/bin/caddy with cap_net_bind_service=ep, so the non-root
      # uid 999 process claims the cap from its bounding set at execve
      # (this line keeps it in the bounding set after cap_drop: ALL).
      - NET_BIND_SERVICE

  # ── Detector ──────────────────────────────────────────────────────────────
  # GPU support requires the NVIDIA Container Runtime on the host.
  # For GPU: COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml (set by setup.sh)
  # For CPU-only: COMPOSE_FILE=docker-compose.yml
  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    image: ${DETECTOR_IMAGE:-ghcr.io/sentania-labs/scarguard-detector}:${IMAGE_TAG:-latest}
    environment:
      # Trust Caddy reverse proxy on the explicit scarguard network subnet
      SCARGUARD_TRUSTED_PROXIES: 172.24.0.0/16
      CONFIG_PATH: /config/scarguard.yml
      SNAPSHOT_DIR: /data/snapshots
      DB_PATH: /data/scarguard.db
      REDIS_USERNAME: detector
      REDIS_PASSWORD: ${REDIS_PASSWORD_DETECTOR:-}
      DETECTION_HMAC_KEY: ${DETECTION_HMAC_KEY:-}
    # v1.14: active healthcheck - pre-v1.14 was `test -f /tmp/healthy`,
    # which a crashed-but-not-exited process passed forever (the file was
    # touched once at startup). Now we require the file's mtime to be
    # within the last minute, which means the main loop must keep
    # touching it.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - scarguard-config:/config:ro
      - scarguard-models:/models:ro
      - scarguard-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 3g
    cpus: 4.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint runs as root to chown volume mounts, then gosu-drops to
    # the scarguard user. Needs CHOWN/FOWNER/DAC_OVERRIDE for the chown
    # and SETUID/SETGID for the user switch. Everything else stays dropped.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  # ── Web UI ─────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-web:${IMAGE_TAG:-latest}
    # No host ports - Caddy reverse proxy handles all external traffic.
    # To access the web UI directly (debugging), uncomment:
    #   ports: ["${WEB_PORT:-8080}:8080"]
    environment:
      CONFIG_PATH: /config/scarguard.yml
      SNAPSHOT_DIR: /data/snapshots
      MODELS_DIR: /models
      TRAINING_WORKSPACE_DIR: /data/training_workspace
      DB_PATH: /data/scarguard.db
      AUTH_DB_PATH: /data/auth.db
      DETERRENT_DB_PATH: /data/deterrent.db
      REDIS_USERNAME: web
      REDIS_PASSWORD: ${REDIS_PASSWORD_WEB:-}
      DETECTION_HMAC_KEY: ${DETECTION_HMAC_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - scarguard-config:/config        # rw - config editor writes scarguard.yml
      - scarguard-models:/models        # rw - model upload endpoint writes here
      - scarguard-data:/data            # rw - reads SQLite + serves snapshots + writes auth.db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint chowns volume mounts as root then gosu-drops to scarguard.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  # ── Notifier ──────────────────────────────────────────────────────────────
  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-notifier:${IMAGE_TAG:-latest}
    environment:
      CONFIG_PATH: /config/scarguard.yml
      NOTIFIER_STATE_DIR: /var/lib/scarguard
      DB_PATH: /data/scarguard.db       # read-only - digest reports query events/metrics
      SNAPSHOT_DIR: /data/snapshots
      MODELS_DIR: /models
      REDIS_USERNAME: notifier
      REDIS_PASSWORD: ${REDIS_PASSWORD_NOTIFIER:-}
      DETECTION_HMAC_KEY: ${DETECTION_HMAC_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - scarguard-config:/config:ro
      - scarguard-models:/models:ro     # ro - digest reports storage size
      - scarguard-data:/data:ro         # ro - reads SQLite + snapshots for attachments/digests
      - scarguard-notifier:/var/lib/scarguard
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint chowns volume mounts as root then gosu-drops to scarguard.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:size=64m

  # ── Deterrent ─────────────────────────────────────────────────────────────
  # Physical deterrence via Tuya Cloud API.  Subscribes to detection events
  # and triggers smart devices (sprinklers, lights, sirens, plugs).
  deterrent:
    build:
      context: .
      dockerfile: services/deterrent/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-deterrent:${IMAGE_TAG:-latest}
    environment:
      CONFIG_PATH: /config/scarguard.yml
      REDIS_USERNAME: deterrent
      REDIS_PASSWORD: ${REDIS_PASSWORD_DETERRENT:-}
      DETECTION_HMAC_KEY: ${DETECTION_HMAC_KEY:-}
      OFF_WATCHDOG_HMAC_KEY: ${OFF_WATCHDOG_HMAC_KEY:-}
      DETERRENT_DB_PATH: /data/deterrent.db
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - scarguard-config:/config:ro
      - scarguard-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Allows the bounded SIGTERM OFF sweep to finish before SIGKILL.
    stop_grace_period: 25s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint chowns volume mounts as root then gosu-drops to scarguard.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # Deterrent doesn't write anywhere except /data (SQLite) and /tmp
    # (healthcheck sentinel).
    read_only: true
    tmpfs:
      - /tmp:size=64m

  # Independent fail-safe: consumes finite signed activation leases and has
  # only OFF-capable Tuya code. It deliberately does not depend on deterrent.
  off-watchdog:
    build:
      context: .
      dockerfile: services/off-watchdog/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-off-watchdog:${IMAGE_TAG:-latest}
    environment:
      CONFIG_PATH: /config/scarguard.yml
      REDIS_USERNAME: off-watchdog
      REDIS_PASSWORD: ${REDIS_PASSWORD_OFF_WATCHDOG:-}
      OFF_WATCHDOG_HMAC_KEY: ${OFF_WATCHDOG_HMAC_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    volumes:
      - scarguard-config:/config:ro
      # Read-only access is needed only for the config decryption key.
      - scarguard-data:/data:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m

  # ── Backup sidecar ────────────────────────────────────────────────────────
  # v1.14: SQLite online-backup sidecar.  Backs up scarguard.db, auth.db,
  # and deterrent.db to /data/backups/{db}/{timestamp}.db.gz on a
  # configurable schedule (default 24h).  Manual triggers via Redis from
  # the admin UI.  Retention: 14 dailies + 8 weeklies by default.
  backup:
    build:
      context: .
      dockerfile: services/backup/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-backup:${IMAGE_TAG:-latest}
    environment:
      CONFIG_PATH: /config/scarguard.yml
      DATA_DIR: /data
      REDIS_USERNAME: backup
      REDIS_PASSWORD: ${REDIS_PASSWORD_BACKUP:-}
      DETECTION_HMAC_KEY: ${DETECTION_HMAC_KEY:-}
    volumes:
      - scarguard-config:/config:ro
      - scarguard-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Docker socket proxy (sidecar) ─────────────────────────────────────────
  # v1.14: tecnativa/docker-socket-proxy mediates Docker API access for the
  # log-streamer instead of mounting /var/run/docker.sock directly. Pre-v1.14
  # any code-execution bug in log-streamer would have given an attacker the
  # full Docker API on the host (start/stop/exec any container).
  #
  # v1.15 (FDY-0558): Put on a dedicated ``scarguard-docker`` network with
  # only the required ``containers/list`` and ``containers/show`` routes plus
  # ``events``.  Explicitly deny archive (file extraction), env, top, exec,
  # and create which ``CONTAINERS:1`` alone leaves readable.  Only the
  # log-streamer talks to this proxy.
  docker-socket-proxy:
    build:
      context: ./services/log-streamer/etc
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    networks:
      - scarguard-docker
    # The proxy itself needs to read the docker socket; it mediates that
    # capability for downstream consumers. Don't drop capabilities on it.

  # ── Log Streamer (sidecar) ────────────────────────────────────────────────
  # Tails container logs via the docker-socket-proxy and publishes to Redis.
  # No direct socket mount - see docker-socket-proxy above.
  #
  # v1.15 (FDY-0558): Connects to ``scarguard-docker`` for the socket proxy
  # and to the default scarguard network for Redis.  read_only with tmpfs
  # limits write surfaces.
  log-streamer:
    build:
      context: .
      dockerfile: services/log-streamer/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-log-streamer:${IMAGE_TAG:-latest}
    environment:
      # Must match the Redis endpoint in scarguard.yml (redis.host / redis.port).
      # Override via .env if Redis is moved off-container.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: log-streamer
      REDIS_PASSWORD: ${REDIS_PASSWORD_LOG_STREAMER:-}
      # docker.from_env() picks up DOCKER_HOST automatically.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    healthcheck:
      # Exec form (JSON array) avoids YAML folded-scalar indentation bugs
      # that broke the previous inline python -c form.
      test: ["CMD", "python3", "-c", "import os,redis,sys; r=redis.Redis(host=os.environ.get('REDIS_HOST','redis'), port=int(os.environ.get('REDIS_PORT','6379')), username=os.environ.get('REDIS_USERNAME') or None, password=os.environ.get('REDIS_PASSWORD') or None); sys.exit(0 if r.get('scarguard:logs:health')==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - scarguard-docker  # docker-socket-proxy TCP
      - default            # Redis pub/sub
    read_only: true
    tmpfs:
      - /tmp:size=32m

  # ── Config API (optional - behind "config-api" profile) ──────────────────
  # v1.15: separate config-write service.  Only starts when launched with
  #   docker compose --profile config-api up
  # When inactive, the web service handles all config writes as before.
  # Enable via system.config_api.enabled: true in scarguard.yml AND the
  # compose profile flag.
  config-api:
    build:
      context: .
      dockerfile: services/config-api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-config-api:${IMAGE_TAG:-latest}
    profiles: ["config-api"]
    environment:
      CONFIG_PATH: /config/scarguard.yml
      DB_PATH: /data/scarguard.db
      AUTH_DB_PATH: /data/auth.db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - scarguard-config:/config        # rw - writes scarguard.yml, certs
      - scarguard-data:/data            # rw - reads auth.db, writes backups
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  # ── Training lifecycle controller (ARM64/Jetson training profile) ────────
  # The controller is the sole application-side Docker write boundary. Its
  # HTTP API is hard-coded to acquire/release the Compose detector service;
  # neither web nor trainer receives a Docker socket or arbitrary container
  # operation.
  #
  # v1.15 (FDY-0558): Moved to a dedicated ``scarguard-training`` network so
  # that ordinary services cannot reach the controller or the trainer.  The
  # socket mount stays ``:ro`` but the controller is the only container on the
  # network that holds it.  Dropped to the ``scarguard`` group so only
  # group-readable Docker metadata is visible, and bounded HTTP/socket
  # handler limits prevent resource exhaustion.
  training-controller:
    profiles: ["training"]
    build:
      context: .
      dockerfile: services/training-controller/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-training-controller:${IMAGE_TAG:-latest}
    environment:
      CONFIG_PATH: /config/scarguard.yml
      CONTROLLER_STATE_PATH: /state/detector-lease.json
      CONTROLLER_LEASE_STALE_SECONDS: 120
      DETECTOR_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-scarguard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: training-controller
      REDIS_PASSWORD: ${REDIS_PASSWORD_TRAINING_CONTROLLER:-}
      # setup.sh backfills this credential on the documented upgrade path.
      TRAINING_CONTROLLER_TOKEN: ${TRAINING_CONTROLLER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - scarguard-config:/config:ro
      - training-controller-state:/state
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # v1.15 (FDY-0558): Drop to non-root uid 999 and join the host Docker
    # group so the controller can open the Docker socket regardless of which
    # numeric GID the host assigns to that group.  The value is injected at
    # run-time by setup.sh (DOCKER_GID) which reads the host docker GID with
    # ``getent group docker | cut -d: -f3``.  Without this, the controller
    # fails with "permission denied" on hosts where the docker GID differs
    # from 999.
    user: "999:999"
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    networks:
      - scarguard-training  # isolated from other services; Redis is also on this network

  # ── Trainer (ARM64/Jetson only - opt-in via COMPOSE_PROFILES=training) ────
  # Uses the L4T base image (ARM64 only, no x86 variant).  Gated behind a
  # profile so `docker compose pull` on x86 hosts doesn't fail on the
  # missing arch manifest.  Enable on the Orin:
  #   echo "COMPOSE_PROFILES=training" >> .env
  trainer:
    profiles: ["training"]
    build:
      context: .
      dockerfile: services/trainer/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-sentania-labs}/scarguard-trainer:${IMAGE_TAG:-latest}
    container_name: scarguard-trainer
    restart: unless-stopped
    user: "0:0"
    volumes:
      - scarguard-config:/config:ro
      - scarguard-models:/models
      - scarguard-data:/data
    environment:
      - CONFIG_PATH=/config/scarguard.yml
      - DB_PATH=/data/scarguard.db
      - MODELS_DIR=/models
      - TRAINING_UPLOADS_DIR=/data/training_uploads
      - TRAINING_WORKSPACE_DIR=/data/training_workspace
      - TRAINING_CONTROLLER_URL=http://training-controller:8090
      - TRAINING_CONTROLLER_TOKEN=${TRAINING_CONTROLLER_TOKEN:-}
      - REDIS_USERNAME=trainer
      - REDIS_PASSWORD=${REDIS_PASSWORD_TRAINER:-}
    depends_on:
      redis:
        condition: service_healthy
      training-controller:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: "4.0"
          pids: 256
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scarguard-training  # trainer can only reach training-controller
      - default              # Redis pub/sub (trainer also needs Redis)

volumes:
  scarguard-caddy-data:
    name: scarguard-caddy-data
  redis-data:
    name: scarguard-redis-data
  scarguard-config:
    name: scarguard-config
  scarguard-models:
    name: scarguard-models
  scarguard-data:
    name: scarguard-data
  training-controller-state:
    name: scarguard-training-controller-state
  scarguard-notifier:
    name: scarguard-notifier

networks:
  default:
    ipam:
      config:
        - subnet: 172.24.0.0/16
  scarguard-docker:
    internal: true  # no egress, only log-streamer ↔ socket-proxy
  scarguard-training:
    internal: true  # only trainer ↔ training-controller
