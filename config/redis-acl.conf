# ScarGuard Redis ACL policy - one named user per service, least privilege.
#
# Format: <username> <redis ACL rules...>
# config/redis-entrypoint.sh prepends "on #<sha256>" (or "on nopass" when
# REDIS_PASSWORD is empty, or "off" when a service credential is missing) and
# writes the result to the aclfile that redis-server loads. Never put a
# credential in this file.
#
# Rules use Redis 7 syntax: -@all then explicit +commands, ~key patterns
# (%R~ read-only), &channel patterns, and a "(...)" selector for publish-only
# channels so a subscriber of scarguard:detections cannot also publish to it.
#
# Channel permissions are symmetric in Redis (a &pattern allows SUBSCRIBE and
# PUBLISH), so publishers and subscribers are split by selector where the
# distinction matters (web, deterrent).

detector resetchannels -@all +ping +client|setinfo +publish +subscribe +unsubscribe +get +set +del ~scarguard:detector:state ~scarguard:stats ~scarguard:rearm_at ~scarguard:eval:progress ~scarguard:eval:result %R~scarguard:trainer:heartbeat &scarguard:detections &scarguard:health &scarguard:detector:command &scarguard:eval:request &scarguard:model.classes.request &scarguard:model.classes.response:* &scarguard:snapshot:request &scarguard:snapshot:result:*

web resetchannels -@all +ping +client|setinfo +subscribe +unsubscribe +get +set +del +exists +scan +lrange +llen +incr +expire +ttl +eval +scard +sadd +srem +multi +exec +discard ~scarguard:stats ~scarguard:rearm_at ~scarguard:eval:progress ~scarguard:eval:result %R~scarguard:detector:state ~scarguard:training:job:* %R~scarguard:logs:buffer:* ~rl:v1:* ~sse:connections:* &scarguard:detections &scarguard:actuations &scarguard:logs:* &scarguard:backup:status &scarguard:deterrent:stuck &scarguard:deterrent:test-fire:result:* &scarguard:deterrent:status:result:* &scarguard:deterrent:force-off:result:* &scarguard:deterrent:test-fire-group:result:* &scarguard:model.classes.response:* &scarguard:snapshot:result:* (+publish &scarguard:backup:trigger &scarguard:deterrent:test-fire &scarguard:deterrent:status-request &scarguard:deterrent:force-off &scarguard:deterrent:test-fire-group &scarguard:eval:request &scarguard:model.classes.request &scarguard:snapshot:request &scarguard:training:job:notify &scarguard:notify:request)

notifier resetchannels -@all +ping +client|setinfo +subscribe +unsubscribe &scarguard:detections &scarguard:health &scarguard:notify:request

deterrent resetchannels -@all +ping +client|setinfo +subscribe +unsubscribe +get +set +del +eval +multi +exec +discard ~scarguard:off-watchdog:lease:* &scarguard:detections &scarguard:deterrent:test-fire &scarguard:deterrent:status-request &scarguard:deterrent:force-off &scarguard:deterrent:test-fire-group (+publish &scarguard:actuations &scarguard:metrics:drops &scarguard:deterrent:stuck &scarguard:notify:request &scarguard:deterrent:test-fire:result:* &scarguard:deterrent:status:result:* &scarguard:deterrent:force-off:result:* &scarguard:deterrent:test-fire-group:result:*)

off-watchdog resetchannels -@all +ping +client|setinfo +get +del +exists +scan +eval ~scarguard:off-watchdog:lease:*

backup resetchannels -@all +ping +client|setinfo +subscribe +unsubscribe +publish &scarguard:backup:trigger &scarguard:backup:status

log-streamer resetchannels -@all +ping +client|setinfo +publish +get +set +del +lpush +lrange +ltrim +zadd +zremrangebyscore +zcard +eval +multi +exec +discard ~scarguard:logs:* &scarguard:logs:*

training-controller resetchannels -@all +ping +get %R~scarguard:trainer:heartbeat

trainer resetchannels -@all +ping +client|setinfo +subscribe +unsubscribe +get +set +del +exists +expire +incr +rpush +ltrim +eval ~scarguard:trainer:heartbeat ~scarguard:training:job:* &scarguard:training:job:notify
