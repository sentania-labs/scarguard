# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║              ScarGuard — Example Configuration File                        ║
# ║                                                                              ║
# ║  Copy this file to config/scarguard.yml and fill in your values.           ║
# ║  Lines starting with '#' are comments and are ignored.                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── System ────────────────────────────────────────────────────────────────────
system:
  # When armed, detections trigger notifications.
  # Toggle this from the web UI dashboard without restarting services.
  armed: true

  # Log verbosity: debug | info | warning | error
  log_level: info

  # IANA timezone name used when displaying timestamps in the web UI and
  # notifications.  All events are stored in UTC — this only affects display.
  # Examples: "America/Los_Angeles", "America/Chicago", "America/New_York",
  #           "Europe/London", "Asia/Tokyo"
  # Leave as "UTC" to keep the existing behaviour.
  timezone: "UTC"

  # How many days to keep snapshots, events, visits, and metrics.
  # The detector cleans up at startup and once per day.
  # Labeled events (training data) are never pruned.
  # Set to 0 to disable automatic cleanup.
  retention_days: 90

  # ── Authentication ────────────────────────────────────────────────────────
  # Gate all web UI routes behind a login page.
  # On first launch (no users in auth.db), the web UI redirects to a one-time
  # account creation page. Use setup.sh to create the initial admin account
  # during installation.
  #
  # Disable auth only on fully private networks. Re-enable before any external
  # access. Always pair with tls.mode=auto (or manual) when accessible beyond LAN.
  #
  # When require_api_auth is false (default), SSE feeds and webhook callbacks
  # remain open so existing integrations (Home Assistant, etc.) keep working.
  # Set to true only after updating all integrations to send a Bearer token.
  #
  auth:
    enabled: true
    session_timeout_hours: 24      # How long a login session lasts
    max_login_attempts: 5          # Failed attempts before lockout
    lockout_duration_minutes: 15   # How long the lockout lasts
    require_api_auth: false        # Set to true to require Bearer token on API/SSE endpoints

  # ── Automatic arm/disarm schedule ─────────────────────────────────────────
  # Arm and disarm automatically at fixed times each day (24-hour format).
  # Manual arm/disarm from the dashboard overrides the schedule until the
  # next scheduled transition.  Leave both fields empty to disable scheduling.
  #
  # Alternatively, set use_solar: true to arm at sunrise and disarm at sunset.
  # Requires latitude and longitude of your location.
  #
  # schedule:
  #   enabled: false              # toggle scheduling on/off without clearing times
  #   arm_time: "06:00"          # arm at 6:00 AM local time
  #   disarm_time: "20:00"       # disarm at 8:00 PM local time
  #
  #   # Solar mode (overrides arm_time/disarm_time when use_solar: true)
  #   use_solar: false
  #   latitude: 37.7749
  #   longitude: -122.4194

  # ── Summary Reports ──────────────────────────────────────────────────────
  # Scheduled digest notifications summarizing detection activity, system
  # health, storage usage, and training data stats.
  #
  # summary_report:
  #   enabled: false                 # disabled by default
  #   frequency: daily               # daily | weekly (Mondays) | monthly (1st)
  #   time: "07:00"                  # send time in system timezone (HH:MM)
  #   channels:                      # notification channel names to receive the digest
  #     - email-digest
  #     - pond-alerts


# ── Cameras ───────────────────────────────────────────────────────────────────
# List one or more UniFi Protect cameras by their RTSP stream URL.
#
# Set the RTSP URL for each camera. The URL format depends on your camera
# vendor — consult your camera's documentation. Examples:
#   UniFi Protect:  rtsp://<CAMERA-IP>:7447/<stream-token>
#   Hikvision:      rtsp://<CAMERA-IP>:554/Streaming/Channels/102
#   Reolink:        rtsp://<CAMERA-IP>:554/h264Preview_01_sub
#
# Use a 720p substream where available — 4K wastes GPU cycles.
cameras:
  - name: pond-north                              # REQUIRED — display name
    rtsp_url: "rtsp://YOUR_CAMERA_IP:7447/YOUR_STREAM_TOKEN_1"  # REQUIRED
    enabled: true
    resolution: 720                               # Substream resolution hint (informational)

  # ── Per-camera model, classes & confidence overrides ────────────────────
  # Optional: use a different YOLO model, detect different classes, or run
  # a different confidence threshold than the global `detection.*` values.
  # Any field omitted inherits the global value.
  #
  # model_path: /models/heron-v2.pt                 # override global model
  # detect_classes: [great_blue_heron, green_heron]  # override global target_classes
  # confidence_threshold: 0.40                      # override global confidence (v0.13.3+)

  # ── Per-camera notification rules ────────────────────────────────────────
  # Optional: route detections to specific notification channels.
  # Rules are evaluated in order; the first match wins.
  # Use class_name: "*" as a catch-all.  Omit notification_rules to notify
  # all channels.
  #
  # v0.13.3 renamed this from `action_rules` — legacy key auto-migrated on
  # load.
  #
  # notification_rules:
  #   - class_name: great_blue_heron
  #     channels: [pond-alerts, email-digest]
  #   - class_name: "*"
  #     channels: [pond-alerts]

  # ── Per-camera deterrent rules (v0.13.3+) ────────────────────────────────
  # Explicit opt-in: only matched classes trigger deterrent actuation.
  # Group names reference entries in `deterrent.groups` (see Actuation
  # section further down).  Empty list = no deterrent for any detection on
  # this camera.
  #
  # deterrent_rules:
  #   - class_name: great_blue_heron
  #     groups: [thermonuclear]
  #   - class_name: raccoon
  #     groups: [minor]

  # Add a second camera by uncommenting and editing:
  # - name: pond-south
  #   rtsp_url: "rtsp://YOUR_CAMERA_IP:7447/YOUR_STREAM_TOKEN_2"
  #   enabled: true
  #   resolution: 720
  #   model_path: /models/heron-v2.pt              # optional per-camera model
  #   detect_classes: [person, great_blue_heron]    # optional per-camera classes


# ── Detection ─────────────────────────────────────────────────────────────────
detection:
  # Path to the YOLO model file INSIDE the container.
  # The host models/ directory is mounted at /models inside the detector container.
  # Place your .pt or .engine file in the models/ directory, then set the path here.
  #
  # Examples:
  #   model_path: /models/best.engine   # TensorRT engine (fastest on Jetson)
  #   model_path: /models/best.pt       # PyTorch weights (universal, slower)
  #   model_path: /models/yolov8n.pt    # Starter model — detects generic "bird" class
  model_path: /models/yolov8n.pt        # REQUIRED — update after adding your model

  # Only trigger events above this confidence level (0.0–1.0).
  # Lower = more sensitive (more false positives); higher = stricter.
  confidence_threshold: 0.25

  # Class names to react to. Must match the class names in your model.
  #
  # If using the starter model (yolov8n.pt), use: [bird]
  # If using a custom heron model, use the classes it was trained with:
  #   [great_blue_heron, green_heron, duck, raccoon]
  target_classes:
    - bird                                        # starter model — replace for custom model

  # Minimum time (seconds) between events for the same class on the same camera.
  # Prevents dozens of events for a heron standing still. 30s is a reasonable start.
  cooldown_seconds: 30

  # Process every Nth frame (1 = every frame, 2 = every other frame, etc.).
  # Higher = fewer CPU/GPU cycles but slightly delayed detection.
  frame_skip: 2


# ── Notifications ─────────────────────────────────────────────────────────────
# Define one or more named channels under `notifications.channels`.  Each
# channel has a unique name and a type (`discord`, `email`, `webhook`,
# `ntfy`).  Reference channel names from per-camera `action_rules` to route
# specific detections to specific channels.  Without rules, every enabled
# channel fires for every detection.
#
# The legacy flat `notifications.discord` and `notifications.email` blocks
# were removed in v0.13.2 and are stripped from the file on the next save.
notifications:
  channels: []
  # Example channels — uncomment and adjust:
  #
  # channels:
  #   - name: pond-alerts
  #     type: discord
  #     enabled: true
  #     webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  #     mention_role: ""           # optional Discord role ID to ping
  #     include_snapshot: true
  #
  #   - name: email-digest
  #     type: email
  #     enabled: true
  #     smtp_host: smtp.gmail.com
  #     smtp_port: 587             # 587 for STARTTLS, 465 for SSL, 25 for plain
  #     smtp_user: you@example.com
  #     smtp_pass: "your-app-password"
  #     to_addresses: [you@example.com]
  #     include_snapshot: true
  #
  #   - name: phone-push
  #     type: ntfy
  #     enabled: true
  #     server: "https://ntfy.sh"
  #     topic: "scarguard-alerts"
  #     # token: "tk_..."          # optional Bearer token for authenticated topics
  #     priority: 3                # 1 (min) to 5 (max/urgent)
  #     include_snapshot: true
  #
  #   - name: home-assistant
  #     type: webhook
  #     enabled: true
  #     url: "http://homeassistant.local:8123/api/webhook/scarguard"
  #     method: POST
  #     # auth_token: "Bearer ..." # optional


# ── TLS ───────────────────────────────────────────────────────────────────────
# TLS is handled by the Caddy reverse proxy container.
# Three modes:
#   off     — HTTP only (default, for LAN use)
#   auto    — Automatic HTTPS via Let's Encrypt (set domain to your public hostname)
#   manual  — Your own cert/key files in the config volume's certs/ directory
#
# Changes are picked up by Caddy within a few seconds (no restart needed).
# You can also configure this in the web UI under Settings > TLS.
tls:
  mode: "off"                           # off | auto | manual
  domain: ""                            # Public hostname — used for TLS and notification feedback links
  cert_path: /config/certs/cert.pem     # Used in manual mode
  key_path: /config/certs/key.pem       # Used in manual mode


# ── Redis (internal message bus) ──────────────────────────────────────────────
# These settings match the redis service defined in docker-compose.yml.
# You should not need to change these unless you run Redis externally.
# Redis authentication (REDIS_PASSWORD) is configured via .env, not here.
redis:
  host: redis
  port: 6379


  # ── Named channels ────────────────────────────────────────────────────────
  # Define multiple named channels; each channel has a unique name and type.
  # Reference channels by name in camera notification_rules.
  #
  # Supported types: discord, email, webhook, ntfy
  #
  # channels:
  #   - name: pond-alerts
  #     type: discord
  #     enabled: true
  #     webhook_url: "https://discord.com/api/webhooks/…"
  #     mention_role: ""
  #     include_snapshot: true
  #
  #   - name: email-digest
  #     type: email
  #     enabled: true
  #     smtp_host: smtp.gmail.com
  #     smtp_port: 587
  #     smtp_user: you@example.com
  #     smtp_pass: your-app-password
  #     to_addresses: [you@example.com]
  #     include_snapshot: true
  #
  #   - name: home-assistant
  #     type: webhook
  #     enabled: true
  #     url: "http://homeassistant.local:8123/api/webhook/scarguard"
  #     method: POST
  #     # auth_token: "Bearer …"   # optional

# ── Physical Deterrence (Tuya Cloud) ──────────────────────────────────────────
# Automated deterrence via Tuya smart devices (sprinklers, lights, sirens,
# smart plugs).  Requires a Tuya IoT Platform account and API credentials.
# See TUYA_SETUP.md for step-by-step instructions.
#
# deterrent:
#   enabled: true
#
#   # Tuya Cloud API credentials — get these from iot.tuya.com
#   tuya:
#     api_key: "your-access-id"
#     api_secret: "your-access-secret"
#     api_region: "us"              # us | eu | cn | in
#
#   # Devices to control — one entry per physical device
#   devices:
#     - name: pond-north-valve
#       device_id: "bf1234567890abcdef"
#       type: sprinkler              # sprinkler | light | sound | plug
#       enabled: true
#     # - name: pond-light
#     #   device_id: "bf0987654321fedcba"
#     #   type: light
#     #   enabled: true
#
#   # Randomisation ranges — vary the response to prevent wildlife habituation
#   defaults:
#     device_count_range: [1, 4]       # how many devices to fire per event
#     spray_duration_range: [3, 8]     # seconds each device stays on
#     inter_device_delay_range: [1, 5] # seconds between device activations
#     pre_delay_range: [0, 3]          # seconds before sequence starts
#     cooldown_seconds: 60             # minimum gap between actuation sequences
#
#   # Battery monitoring — alerts when device batteries run low
#   battery_monitor:
#     enabled: true
#     check_interval_hours: 24
#     alert_threshold_percent: 20
